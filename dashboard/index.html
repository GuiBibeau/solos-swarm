<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>solos-swarm · Telemetry &amp; Capability Monitor</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="instrument.css" />
    <link rel="stylesheet" href="observatory.css" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var theme = params.get("theme");
        if (theme !== "light" && theme !== "dark") {
          try {
            theme = localStorage.getItem("solos-swarm-theme");
          } catch (_) {
            theme = null;
          }
        }
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to telemetry</a>
    <input id="snapshot-file-input" type="file" accept="application/json,.json" hidden />
    <div id="app" aria-live="polite"></div>
    <noscript>
      <p class="noscript-notice">JavaScript is required to inspect solos-swarm snapshots.</p>
    </noscript>
    <script src="spatial.js" defer></script>
    <script src="telemetry.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>

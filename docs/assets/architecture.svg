<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 6.5 4 L 0 6.5" fill="none" stroke="#52525B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Matte Carbon Canvas -->
  <rect x="0" y="0" width="1200" height="380" rx="12" fill="#09090B"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="11.5" fill="none" stroke="#222228" stroke-width="1"/>

  <!-- Card 01: Intent -->
  <g transform="translate(60, 96)">
    <rect x="0" y="0" width="234" height="148" rx="8" fill="#121215" stroke="#222228" stroke-width="1"/>
    <text x="24" y="38" fill="#52525B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="0.08em">01 / INTENT</text>
    <text x="24" y="82" fill="#F4F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="-0.01em">Goal · Need · Task</text>
    <text x="24" y="110" fill="#8E8E98" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400">Ordered Board</text>
  </g>

  <!-- Connector 01 -> 02 -->
  <line x1="294" y1="170" x2="340" y2="170" stroke="#3F3F46" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Card 02: Kernel -->
  <g transform="translate(342, 96)">
    <rect x="0" y="0" width="234" height="148" rx="8" fill="#121215" stroke="#222228" stroke-width="1"/>
    <text x="24" y="38" fill="#52525B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="0.08em">02 / KERNEL</text>
    <text x="24" y="82" fill="#F4F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="-0.01em">Raft over mTLS QUIC</text>
    <text x="24" y="110" fill="#8E8E98" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400">Capability Lease · Spend Hold</text>
  </g>

  <!-- Connector 02 -> 03 -->
  <line x1="576" y1="170" x2="622" y2="170" stroke="#3F3F46" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Card 03: Sandboxes -->
  <g transform="translate(624, 96)">
    <rect x="0" y="0" width="234" height="148" rx="8" fill="#121215" stroke="#222228" stroke-width="1"/>
    <text x="24" y="38" fill="#52525B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="0.08em">03 / SANDBOXES</text>
    <text x="24" y="82" fill="#F4F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="-0.01em">Pi · WASI · Firecracker</text>
    <text x="24" y="110" fill="#8E8E98" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400">Zero ambient keys</text>
  </g>

  <!-- Connector 03 -> 04 -->
  <line x1="858" y1="170" x2="904" y2="170" stroke="#3F3F46" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Card 04: Verification -->
  <g transform="translate(906, 96)">
    <rect x="0" y="0" width="234" height="148" rx="8" fill="#121215" stroke="#222228" stroke-width="1"/>
    <text x="24" y="38" fill="#52525B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="0.08em">04 / VERIFICATION</text>
    <text x="24" y="82" fill="#F4F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="-0.01em">Evaluator &amp; Witness</text>
    <text x="24" y="110" fill="#8E8E98" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400">Oracle rubric · Merkle root</text>
  </g>

  <!-- Subtle Return Baseline (04 -> 02) -->
  <path d="M 1023 244 L 1023 296 Q 1023 304 1015 304 L 467 304 Q 459 304 459 296 L 459 248" fill="none" stroke="#27272A" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="596" y="292" width="290" height="22" rx="4" fill="#09090B"/>
  <text x="741" y="307" text-anchor="middle" fill="#52525B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="0.04em">SignedTreeHead &amp; Receipt Settlement</text>
</svg>

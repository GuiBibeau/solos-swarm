<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" role="img" aria-labelledby="numbers-title numbers-desc">
  <title id="numbers-title">Settled spend against the cap for one live 10-agent run</title>
  <desc id="numbers-desc">Run live-20260412-132831 settled 17,438 micro-USD of a 1,000,000 micro-USD cap, or 1.7 percent. Ten of ten workers finished in 124.78 seconds. The run made 22 provider calls, held no cost at the end, leaked no keys and produced an exact final artifact.</desc>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#6e7681">
    <text x="36" y="40" font-size="23" font-weight="600">Settled spend against the cap</text>
    <text x="36" y="66" font-size="14">Run live-20260412-132831. 10 of 10 workers. Exact final artifact. 124.78 s.</text>

    <text x="36" y="116" font-size="15">Budget cap</text>
    <text x="724" y="116" font-size="15" font-weight="600" text-anchor="end">$1.00</text>
    <rect x="36" y="128" width="688" height="18" rx="9" fill="#6e7681" fill-opacity="0.14"/>
    <rect x="36" y="128" width="688" height="18" rx="9" fill="#6e7681" fill-opacity="0.28"/>

    <text x="36" y="184" font-size="15">Settled spend</text>
    <text x="724" y="184" font-size="15" font-weight="600" text-anchor="end">$0.017438</text>
    <rect x="36" y="196" width="688" height="18" rx="9" fill="#6e7681" fill-opacity="0.14"/>
    <rect x="36" y="196" width="12" height="18" rx="6" fill="#2f81f7"/>
    <text x="60" y="210" font-size="13">1.7% of the cap</text>

    <line x1="36" y1="244" x2="724" y2="244" stroke="#6e7681" stroke-opacity="0.25"/>

    <text x="36" y="278" font-size="22" font-weight="600">124.78 s</text>
    <text x="36" y="298" font-size="12">wall-clock run</text>

    <text x="208" y="278" font-size="22" font-weight="600">10 / 10</text>
    <text x="208" y="298" font-size="12">workers finished</text>

    <text x="380" y="278" font-size="22" font-weight="600">22</text>
    <text x="380" y="298" font-size="12">provider calls</text>

    <text x="552" y="278" font-size="22" font-weight="600">0</text>
    <text x="552" y="298" font-size="12">leaked keys</text>

    <text x="724" y="278" font-size="22" font-weight="600" text-anchor="end">0</text>
    <text x="724" y="298" font-size="12" text-anchor="end">held at end</text>
  </g>
</svg>

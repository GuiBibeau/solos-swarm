[package]
name = "solos-agent-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pure domain core of solos-swarm agent mode: Triggers, Threads, Evals, Tickets and Assignments behind ports."
license = "Apache-2.0"
repository = "https://github.com/GuiBibeau/solos-swarm"

# The hexagon's inside. Only pure, I/O-free crates belong here; tests/boundary.rs
# fails the build if anything else is added (no tokio, reqwest, fs, process).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[lints]
workspace = true

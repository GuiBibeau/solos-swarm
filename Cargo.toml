[workspace]
members = ["crates/agent-core", "crates/agent-store"]
default-members = [".", "crates/agent-core", "crates/agent-store"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Google guidance: unsafe must be small and its correctness documented.
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
# Debug leftovers do not ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
wildcard_imports = "warn"
# Deferred (too many hits for a mechanical PR; tracked in docs/rust-style.md):
# unwrap_used / expect_used (non-test: ~110), enum_glob_use (5), must_use_candidate (~150),
# cast_possible_truncation / cast_sign_loss / cast_possible_wrap (~70), missing_errors_doc (~300).

[package]
name = "solos-swarm"
version = "0.1.0"
edition = "2024"
publish = false
description = "Runs sandboxed AI coding agents on Linux under a budget, in two modes: swarm mode runs 1 to 30 Pi agents on one goal, and agent mode is an always-on agent that takes requests from Discord, Slack, GitHub and MCP hosts."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/GuiBibeau/solos-swarm"
keywords = ["ai-agents", "coding-agent", "llm", "mcp", "sandbox"]
categories = ["artificial-intelligence", "command-line-utilities", "development-tools", "virtualization"]

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
clap = { version = "=4.6.7", features = ["derive"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "=0.9.34"
sha2 = { version = "=0.10.9", features = ["oid"] }
solos-agent-core = { path = "crates/agent-core" }
solos-agent-store = { path = "crates/agent-store" }
tokio = { version = "=1.53.3", features = ["full"] }
# Slack Socket Mode. TLS is the rustls (ring) that reqwest already uses; no OpenSSL.
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
uuid = { version = "=1.27.0", features = ["v4"] }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core", "pkcs8"] }
rcgen = { version = "=0.14.10", features = ["x509-parser", "pem"] }
x509-parser = { version = "=0.18.1", features = ["verify"] }
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto"] }
# The GitHub App's RS256 JWT. rsa is already in the lock through jsonwebtoken's rust_crypto; used directly, its
# RsaPrivateKey zeroizes on drop, which jsonwebtoken's EncodingKey (a plain Vec of DER) does not.
rsa = "=0.9.10"
rand = "=0.8.6"
time = { version = "=0.3.55", features = ["serde"] }
getrandom = "=0.4.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
http-body-util = "0.1"
httpdate = "=1.0.3"
base64 = "0.22"
zeroize = "=1.9.1"
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
minijinja = { version = "=2.24.0", features = ["json", "fuel"] }
minijinja-contrib = { version = "=2.24.0", features = ["pycompat"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
wasmtime = { version = "=49.0.4", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "wat"] }
wasmtime-wasi = { version = "=49.0.4", default-features = false, features = ["p1"] }

opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "with-serde"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.22", default-features = false, features = ["registry", "std"] }
tracing-opentelemetry = { version = "=0.33.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"
seccompiler = "=0.5.0"
libc = "=0.2.190"

[dev-dependencies]
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "cache", "fallible_uint"] }

[lints]
workspace = true

[profile.release]
strip = true

# The tests spend their CPU in these crates (hashing, sealing and signing evidence, SQLite, JSON), which a debug
# build runs 10-50x slower than it needs to: the 33 MB archive test took 40 s, and a sealed store, an audit chain
# or a signed raft entry costs milliseconds each. Optimising just them (not wasmtime and cranelift, which would
# add minutes to every cold build) roughly halves the CPU time of the suite. Debug assertions and overflow checks
# stay on, so what the tests check does not change.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
[profile.dev.package.zeroize]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.ed25519]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.ring]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.rusqlite]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3

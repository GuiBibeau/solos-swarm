# cargo-nextest settings. CI builds the test binaries once (`cargo nextest archive`) and runs them across a
# matrix of shards (`--partition count:N/M`); see .github/workflows/ci.yml. Locally: `cargo nextest run`.
#
# nextest runs every test in its own process. The in-process shared state `cargo test` has between tests of one
# binary (statics, the working directory, the environment) cannot leak, so tests do not have to run one at a
# time the way `cargo test -- --test-threads=1` ran them.

[profile.default]
# One failure does not hide the others: a PR sees every test it broke in one run.
fail-fast = false

[profile.ci]
fail-fast = false
# Every test, with its time, in the log: the slowest ones decide how the shards are balanced.
status-level = "pass"
final-status-level = "slow"
# A test that hangs is killed after 5 minutes (the slowest healthy test takes under a minute) instead of
# holding the shard until the job's timeout.
slow-timeout = { period = "60s", terminate-after = 5 }

# The slowest tests start first, so they overlap the rest of the shard instead of being the last thing it waits
# for. The three raft tests are bound by election timeouts (about 40 s each however fast the machine is); the
# archive test is bound by hashing and sealing 33 MB.
[[profile.ci.overrides]]
filter = 'test(/^cluster::tests::(actual_raft_over_mtls_quic|expired_three_voter|signed_checkpoint)/) | test(/^qa::tests::large_observation/)'
priority = 100

# Then the ones that take more than about 5 s.
[[profile.ci.overrides]]
filter = 'test(/^agent::swarm_executor::/) | test(/^broker::control_tests::resume/) | test(/^kernel::tests::quorum_commits/) | test(/^node::receiver_tests::actual_worker_claim/) | test(the_scripted_bench_runs_every_design) | test(remote_background_jobs_start_wait_and_stop) | test(seeded_random_walk) | test(sqlite_store_matches_memory_store) | test(five_outage_errors_pause)'
priority = 50

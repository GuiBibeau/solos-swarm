# cargo-nextest settings. CI builds the test binaries once (`cargo nextest archive`) and runs them across a
# matrix of shards (`--partition count:N/M`); see .github/workflows/ci.yml. Locally: `cargo nextest run`.
#
# nextest runs every test in its own process. The in-process shared state `cargo test` has between tests of one
# binary (statics, the working directory, the environment) cannot leak, so tests do not have to run one at a
# time the way `cargo test -- --test-threads=1` ran them.

[profile.default]
# One failure does not hide the others: a PR sees every test it broke in one run.
fail-fast = false

[profile.ci]
fail-fast = false
# Every test, with its time, in the log.
status-level = "pass"
final-status-level = "slow"
# A test that hangs is killed after 5 minutes (the slowest healthy test takes under a minute) instead of
# holding the shard until the job's timeout.
slow-timeout = { period = "60s", terminate-after = 5 }
# The shards run everything except the four tests below, which run in `ci-isolated`.
default-filter = 'not (test(the_scripted_bench_runs_every_design_and_shows_what_each_one_changes) | test(/^cluster::tests::(actual_raft_over_mtls_quic|expired_three_voter|signed_checkpoint)/))'

# Four tests assert on the wall clock and fail when the machine is busy with other tests, not when the code is
# wrong: three raft tests (heartbeats every 200 ms, elections within 800-1400 ms, certificates that live 4 s) and
# the scripted bench (a workload minute lasts 0.6 s, and the test allows 0.3 s of overhead). On a runner shared
# with three other tests they failed 3 to 4 times in 4 (measured; see the PR). Run one at a time on a runner of
# their own, which is the condition `cargo test -- --test-threads=1` gave them, they pass.
#
# CI runs this profile once per partition (`--partition count:N/4`) so the four run side by side on four runners.
# The expression is the complement of `ci`'s `default-filter` above; the workflow checks that the two profiles
# together list exactly the tests the default profile lists.
[profile.ci-isolated]
inherits = "ci"
test-threads = 1
default-filter = 'test(the_scripted_bench_runs_every_design_and_shows_what_each_one_changes) | test(/^cluster::tests::(actual_raft_over_mtls_quic|expired_three_voter|signed_checkpoint)/)'
